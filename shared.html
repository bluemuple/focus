<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bidoro — My shared notes</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9; color: #111827; padding: 18px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: .85rem; margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin: 0 0 16px; }
  .memo { font-size: 1.05rem; font-weight: 600; }
  .when { color: #6b7280; font-size: .78rem; margin-top: 2px; }
  .maxv { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .85rem; color: #374151; }
  .maxv input { width: 84px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
  .maxv button { padding: 6px 12px; border: 1px solid #111827; background: #111827; color: #fff; border-radius: 8px; font-weight: 700; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #eee; vertical-align: top; font-size: .92rem; }
  th { color: #6b7280; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
  .tag { display: inline-block; font-size: .68rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .tag.ai { background: #ede9fe; color: #6d28d9; }
  .tag.reported { background: #fee2e2; color: #b91c1c; }
  .tag.heart { background: #fce7f3; color: #db2777; }
  .empty { color: #9ca3af; padding: 18px 0; }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px 14px; border-radius: 10px; }
  a.back { display: inline-block; margin-top: 10px; color: #2563eb; text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0f17; color: #e5e7eb; }
    .card { background: #111827; border-color: #1f2937; }
    th, td { border-color: #1f2937; } .sub, .when, .th { color: #9ca3af; }
  }
</style>
</head>
<body>
  <h1>My shared notes</h1>
  <p class="sub">Everything you've shared from Bidoro Notes, plus the replies it received. Replies marked <b>ai</b> were written automatically when your note went a day without an answer.</p>
  <div id="root"><p class="empty">Loading…</p></div>
  <a class="back" href="./index.html">← Back to Bidoro</a>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SB_URL = 'https://sbatsnivlrlywpfytlio.supabase.co';
const SB_KEY = 'sb_publishable_vwZUKHhhtBEjAgXrZQTNFQ_bQeM8Ypc';
const STORAGE_KEY = 'concentration-app-v1';
const root = document.getElementById('root');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(ts){ try { return new Date(ts).toLocaleString(); } catch(_) { return ts || ''; } }

function readState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch(_) { return {}; }
}

async function main(){
  const st = readState();
  const clientId = st.shareClientId;
  if (!clientId) { root.innerHTML = '<div class="err">No share identity found on this device yet. Open Bidoro and share a note first, then come back here.</div>'; return; }
  const sb = createClient(SB_URL, SB_KEY, { auth: { storageKey: 'sb-bidoro-shared-admin', persistSession: false } });

  // My memo(s) — the board upserts one row per device, so usually just one.
  const { data: memos, error: mErr } = await sb.from('focus_shared_memos')
    .select('id, text, created_at, updated_at, max_viewers').eq('client_id', clientId).order('created_at', { ascending: false });
  if (mErr) { root.innerHTML = '<div class="err">Could not load (' + esc(mErr.message) + '). Has supabase-memo-comments.sql been run?</div>'; return; }
  if (!memos || !memos.length) { root.innerHTML = '<p class="empty">You haven\'t shared a note yet.</p>'; return; }

  const ids = memos.map(m => m.id);
  const { data: comments } = await sb.from('focus_memo_comments')
    .select('id, memo_id, text, hearted, reported, is_ai, created_at').in('memo_id', ids).order('created_at', { ascending: true });
  const byMemo = {};
  (comments || []).forEach(c => { (byMemo[c.memo_id] = byMemo[c.memo_id] || []).push(c); });

  root.innerHTML = '';
  memos.forEach(m => {
    const card = document.createElement('div'); card.className = 'card';
    const replies = byMemo[m.id] || [];
    let html = '<div class="memo">' + esc(m.text) + '</div>'
      + '<div class="when">Shared ' + fmt(m.created_at) + (replies.length ? (' · ' + replies.length + ' repl' + (replies.length===1?'y':'ies')) : ' · no replies yet') + '</div>'
      + '<div class="maxv"><label>Max people who can see this:</label>'
      + '<input type="number" min="0" step="1" id="mv-' + m.id + '" value="' + (m.max_viewers == null ? '' : m.max_viewers) + '" placeholder="∞">'
      + '<button data-mv="' + m.id + '">Save</button></div>';
    if (replies.length) {
      html += '<table><thead><tr><th>Reply</th><th>When</th></tr></thead><tbody>';
      replies.forEach(c => {
        html += '<tr><td>' + esc(c.text)
          + (c.is_ai ? '<span class="tag ai">ai</span>' : '')
          + (c.hearted ? '<span class="tag heart">♥ hearted</span>' : '')
          + (c.reported ? '<span class="tag reported">reported</span>' : '')
          + '</td><td class="when">' + fmt(c.created_at) + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    card.innerHTML = html;
    root.appendChild(card);
  });

  // Wire the "max viewers" save buttons.
  root.querySelectorAll('button[data-mv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-mv');
      const raw = document.getElementById('mv-' + id).value.trim();
      const val = raw === '' ? null : Math.max(0, parseInt(raw, 10) || 0);
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await sb.from('focus_shared_memos').update({ max_viewers: val }).eq('id', id);
      btn.disabled = false; btn.textContent = error ? 'Failed' : 'Saved ✓';
      setTimeout(() => { btn.textContent = 'Save'; }, 1500);
    });
  });
}
main().catch(e => { root.innerHTML = '<div class="err">' + esc(String(e)) + '</div>'; });
</script>
</body>
</html>
