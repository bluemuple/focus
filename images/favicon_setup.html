<!-- Bidoro 홈페이지 <head> 영역에 다음 코드를 추가하세요 -->

<!-- Favicon - 브라우저 탭 -->
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">

<!-- Favicon - 최신 브라우저 (PNG) -->
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">

<!-- 북마크/홈화면 아이콘 (Android, iOS) -->
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png">
<link rel="apple-touch-icon" href="/images/favicon-192x192.png">

<!-- 웹 앱 설정 -->
<meta name="theme-color" content="#ffeaa7">
<meta name="description" content="Bidoro - Focus your learning">

<!-- 추가 크기 (선택사항) -->
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64x64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-128x128.png">
<link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256x256.png">

<!-- 사용 방법 -->
<!-- 
1. 위 코드를 HTML 파일의 <head></head> 안에 복사
2. favicon 이미지들을 /images 폴더에 저장
   (또는 href 경로를 자신의 폴더 구조에 맞게 수정)
3. 브라우저 캐시 삭제 후 새로고침하면 적용됨

예시 폴더 구조:
bidoro-homepage/
├── index.html
├── images/
│   ├── favicon.ico
│   ├── favicon-16x16.png
│   ├── favicon-32x32.png
│   ├── favicon-64x64.png
│   ├── favicon-128x128.png
│   ├── favicon-192x192.png
│   └── favicon-256x256.png
-->
