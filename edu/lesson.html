<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale=1 + user-scalable=no kill iOS' double-tap zoom
       on the lesson body so a fast double-tap doesn't zoom the page
       (still leaves text-size + spacing adjustments to the in-page
       Aa controls). On Android, touch-action: manipulation on the
       body (CSS) does the same. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Ako — Reading</title>
  <link rel="stylesheet" href="./css/styles.css?v=dvh-lock-1">
  <!-- Dyslexia-friendly & readability fonts loaded only on the lesson
       page (where the "Read Better" toggle uses them). Cheap because
       they're fetched once and cached by the CDN, and the browser
       only downloads woff2 when the toggle is on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
  <link rel="stylesheet"
        href="https://fonts.cdnfonts.com/css/open-dyslexic">
  <!-- Preload the self-hosted OpenDyslexic OTF so the first Read Better
       toggle swaps fonts without a flash. `crossorigin` is harmless on
       same-origin requests and lets browsers reuse the preload for the
       @font-face fetch instead of double-fetching. -->
  <link rel="preload" href="./OpenDyslexic-Regular.otf"
        as="font" type="font/otf" crossorigin>
</head>
<body class="wc-lesson-layout">
  <!-- Stash the header in a hidden element so the lesson-page renders
       chrome-less per spec; profile / coin info still accessible via
       the bottom-bar 📋 button which routes to profile.html. -->
  <div id="userName" hidden>…</div>
  <div id="userMoney" hidden>0</div>
  <a href="#" id="logoutBtn" hidden></a>

  <div class="wc-shell wc-shell-wide">
    <div class="wc-lesson-grid">
      <!-- ============================================================
           MAIN reading card  (또박또박 layout)
           ============================================================ -->
      <article class="wc-lesson-main">

        <!-- Header — just back chip + title + 1문장씩, no thumbnail.
             The thumbnail used to mirror 또박또박's layout but the
             page counter moved to the bottom bar and lessons don't
             carry per-lesson thumbnail images, so it had no purpose
             remaining. -->
        <div class="wc-lesson-titlerow">
          <a class="back-btn" href="./home.html" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 6 9 12 15 18"/>
            </svg>
          </a>
          <h1 id="lessonTitle">Loading…</h1>
          <!-- Collapse the toolbar to give the reading text more room.
               Two SVG icons live inside the button — CSS swaps which
               is visible based on `body.wc-head-collapsed`. Inline SVG
               beats a webp here: sharper at any zoom, smaller payload,
               no extra HTTP fetch, picks up `currentColor`. -->
          <button class="ht-collapse" id="btnHeadCollapse" type="button"
                  aria-expanded="true" aria-label="Hide the toolbar"
                  title="Hide the toolbar">
            <!-- OPEN state — toolbar is showing; click hides it.
                 Three stacked bars represent the visible toolbar; the
                 student sees "three things on; tap to put them away". -->
            <svg class="ht-coll-svg ht-coll-open" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="7"  x2="19" y2="7"  />
              <line x1="5" y1="12" x2="19" y2="12" />
              <line x1="5" y1="17" x2="19" y2="17" />
            </svg>
            <!-- CLOSED state — toolbar is hidden; click expands it.
                 Title bar at top + chevron-down below = "more below,
                 tap to expand". Mirrors the open state's top bar so
                 the transition reads as "the rest collapses into a
                 single tuck-down arrow". -->
            <svg class="ht-coll-svg ht-coll-closed" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="7" x2="19" y2="7" />
              <polyline points="7 13 12 18 17 13" />
            </svg>
          </button>
        </div>
        <div class="wc-lesson-head">
          <!-- Record mode — reveals a record button on every sentence
               so the student can record themselves reading it. -->
          <button class="ht-btn" id="btnRecord" type="button" aria-pressed="false"
                  title="Record yourself reading each sentence">
            <span class="ht-ico">⏺</span>
            <span class="ht-label">Record</span>
          </button>
          <button class="ht-btn" id="btnSingle" type="button" aria-pressed="false"
                  title="Show one sentence at a time, 2× size">
            <span class="ht-ico">📜</span>
            <span class="ht-label">1 Sentence</span>
          </button>
          <!-- Chunk-level auto-TTS toggle. Default = ON (Play chunk),
               so a fresh lesson immediately speaks each tapped word's
               chunk. The button only governs chunk-on-tap audio —
               full sentence play (▶), sidebar headword 🔊 and the
               other TTS calls bypass it. -->
          <button class="ht-btn active" id="btnChunkMute" type="button" aria-pressed="false"
                  title="Chunk audio on word tap — click to toggle">
            <span class="ht-ico" id="btnChunkMuteIco">🔊</span>
            <span class="ht-label" id="btnChunkMuteLabel">Play chunk</span>
          </button>
          <!-- Aa — reveals the text-size / line-spacing controls. The
               four A−/A+/↕−/↕+ buttons sit in .ht-fz-wrap, hidden by
               default; body.wc-fz-open (set by this button) shows them.
               State is per-device (localStorage). -->
          <button class="ht-btn" id="btnTextOpts" type="button" aria-pressed="false"
                  title="Text size & line spacing">
            <span class="ht-ico ht-ico-aa">Aa</span>
          </button>
          <span class="ht-fz-wrap" id="htFzWrap">
            <button class="ht-btn ht-btn-fz" id="btnFontMinus" type="button" title="Smaller text">A−</button>
            <button class="ht-btn ht-btn-fz" id="btnFontPlus"  type="button" title="Bigger text">A+</button>
            <button class="ht-btn ht-btn-fz" id="btnLhMinus"   type="button" title="Tighter line spacing">↕−</button>
            <button class="ht-btn ht-btn-fz" id="btnLhPlus"    type="button" title="Looser line spacing">↕+</button>
          </span>
          <button class="ht-btn" id="btnReadBetter" type="button" aria-pressed="false"
                  title="Switch to a dyslexia-friendly font">
            <span class="ht-ico">👓</span>
            <span class="ht-label">Read Better</span>
          </button>
          <!-- Per-device toggle to pause the animal-encounter system.
               DEFAULT = HIDDEN (off) — quiet reading mode is the
               out-of-the-box experience; the student can opt in by
               tapping this chip. Active state means encounters are
               HIDDEN. State persists via localStorage. -->
          <button class="ht-btn" id="btnHideEncounters" type="button" aria-pressed="false"
                  title="Pause animal quizzes — quiet reading mode">
            <span class="ht-ico" id="btnHideEncountersIco">🐾</span>
            <span class="ht-label" id="btnHideEncountersLabel">on</span>
          </button>
          <!-- Sidebar language — Kor Bar (Korean word card) / Eng Bar
               (English). Default Kor Bar. The Korean sidebar content
               itself lands in a later phase; this wires the toggle and
               flags <body> (wc-bar-kor / wc-bar-eng) for it. -->
          <button class="ht-btn" id="btnBarLang" type="button"
                  title="Sidebar language — Korean / English">
            <span class="ht-ico">🌐</span>
            <span class="ht-label" id="btnBarLangLabel">Kor Bar</span>
          </button>
          <!-- Continuous-scroll toggle — ⬇ off / on. ON drops
               pagination and flows the whole lesson in one
               scrollable column (comic panels stacked vertically).
               Default off for text/song lessons, on for comic. -->
          <button class="ht-btn" id="btnScrollMode" type="button" aria-pressed="false"
                  title="Continuous scroll — show the whole lesson in one scrolling column">
            <span class="ht-ico">⬇</span>
            <span class="ht-label" id="btnScrollModeLabel">off</span>
          </button>
        </div>

        <!-- Body. Paginated by paragraph: each <p class="para"> is one
             "page" the user steps through via the bottom-bar arrows. -->
        <div class="wc-lesson-text-wrap">
          <div id="lessonBody" class="wc-lesson-text">
            <p class="wc-muted">Loading lesson…</p>
          </div>
        </div>
      </article>

      <!-- ============================================================
           SIDEBAR  (또박또박-style: scroll body + bottom-fixed level-bar)
           ============================================================ -->
      <aside class="wc-sidebar" aria-label="Word details">
        <button class="wc-side-toggle" id="sideToggle" aria-expanded="true">⟩</button>
        <div class="wc-sidebar-scroll" id="sideScroll">
          <section id="sideWord"        class="wc-side-section wc-side-word"></section>
          <section id="sideViz"         class="wc-side-section"></section>
          <section id="sideReplies"     class="wc-side-section"></section>
        </div>
        <!-- Bottom-fixed level picker — same 6-circle layout as
             또박또박's .ls-bottom-fixed (🗑 1 2 3 4 ✓). Hidden until
             a word is selected so the sidebar doesn't feel busy when
             the student first lands on the lesson. -->
        <div class="wc-side-bottom-fixed" id="sideLevelBar" hidden></div>
      </aside>
    </div>
  </div>

  <!-- ============================================================
       STICKY BOTTOM BAR — 또박또박 style, 6 buttons
         ▶  ‹‹ (prev page)  ‹ (prev word)  N / total  › (next word)  ›› (next page)
       ============================================================ -->
  <div class="wc-lesson-bar" id="lessonBar">
    <button class="lb-play" id="btnPlay" aria-label="Play" title="Play / pause whole-lesson audio (spacebar)">▶</button>
    <!-- Play every sentence the student recorded, in order. Light-blue,
         hidden until at least one recording exists. -->
    <button class="lb-play wc-playrec wc-hidden" id="btnPlayRec" type="button"
            aria-label="내 녹음 전체 듣기" title="내 녹음 전체 듣기">▶</button>
    <button class="lb-arrow lb-arrow-page" id="btnPagePrev" aria-label="Previous page" title="Previous page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="18 6 12 12 18 18"/>
        <polyline points="12 6 6 12 12 18"/>
      </svg>
    </button>
    <button class="lb-arrow" id="btnPrev" aria-label="Previous word" title="Previous word">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 6 9 12 15 18"/>
      </svg>
    </button>
    <span class="lb-page-count" id="lbPageCount">1 / 1</span>
    <button class="lb-arrow" id="btnNext" aria-label="Next word" title="Next word">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 6 15 12 9 18"/>
      </svg>
    </button>
    <button class="lb-arrow lb-arrow-page" id="btnPageNext" aria-label="Next page" title="Next page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 6 12 12 6 18"/>
        <polyline points="12 6 18 12 12 18"/>
      </svg>
    </button>
  </div>

  <!-- ============================================================
       MOBILE WORD SHEET + ACTION BAR (≤900px only — CSS-gated).
       Sheet (with × + 3 carousel pages) sits ABOVE an always-
       visible 8-button word-action bar. Empty until a word is
       tapped; sheet height animates per visible page. -->
  <div class="wc-mobsh" id="wcMobSh" aria-hidden="true">
    <div class="wc-mobsh-sheet" id="wcMobShSheet">
      <button class="wc-mobsh-close" id="wcMobShClose"
              type="button" aria-label="닫기">×</button>
      <div class="wc-mobsh-pages" id="wcMobShPages">
        <!-- Page 1 — 뜻: selected word + Korean meaning,
             chunk underline EN + Korean translation. -->
        <div class="wc-mobsh-page" data-page="meaning">
          <div class="wc-mobsh-headline" id="wcMobShHeadline">
            <span class="wc-mobsh-empty wc-muted">단어를 눌러보세요</span>
          </div>
          <div class="wc-mobsh-chunk" id="wcMobShChunk" hidden>
            <div class="wc-mobsh-chunk-en" id="wcMobShChunkEn"></div>
            <div class="wc-mobsh-chunk-ko" id="wcMobShChunkKo"></div>
          </div>
        </div>
        <!-- Page 2 — 단어 더보기: family / similar / opposite. -->
        <div class="wc-mobsh-page" data-page="more">
          <div class="wc-mobsh-more" id="wcMobShMore">
            <span class="wc-mobsh-more-empty">단어를 누르면 가족·비슷한·반대말이 보여요.</span>
          </div>
        </div>
        <!-- Page 3 — 메시지: 이 단어를 듣거나 써봤다면 적어줘. -->
        <div class="wc-mobsh-page" data-page="msg">
          <div class="wc-mobsh-msg-title">💌 이 단어를 듣거나 써봤다면 적어줘!</div>
          <textarea class="wc-mobsh-msg-input" id="wcMobShMsgInput"
                    rows="3" placeholder="언제, 어디서 이 단어를 만났는지 적어보세요."></textarea>
          <div class="wc-mobsh-msg-actions">
            <span class="wc-mobsh-msg-status" id="wcMobShMsgStatus"></span>
            <button class="wc-mobsh-msg-send" id="wcMobShMsgSend"
                    type="button" disabled>보내기 📨</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Always-visible 8-button word-action bar. -->
    <div class="wc-mobsh-bar" id="wcMobShBar">
      <button class="wc-mobsh-circ is-tts" id="wcMobShTts"
              type="button" aria-label="TTS 재생" title="TTS 재생">▶</button>
      <button class="wc-mobsh-circ" id="wcMobShPrevWord"
              type="button" aria-label="이전 단어" title="이전 단어">‹</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="1"
              type="button" aria-label="단계 1" title="잘 몰라요">1</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="2"
              type="button" aria-label="단계 2" title="조금 알아요">2</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="3"
              type="button" aria-label="단계 3" title="알아요">3</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="4"
              type="button" aria-label="단계 4" title="잘 알아요">4</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="5"
              type="button" aria-label="완전히 알아요" title="완전히 알아요">✓</button>
      <button class="wc-mobsh-circ" id="wcMobShNextWord"
              type="button" aria-label="다음 단어" title="다음 단어">›</button>
    </div>
  </div>

  <!-- Recording bar — replaces the nav bar while Record mode is on.
       Acts on the "active line" (the last sentence whose ⏺ was used).
       [▶ play] [⏺ record] [1][2][3] takes. -->
  <div class="wc-lesson-bar wc-rec-bar wc-hidden" id="wcRecBar">
    <button class="lb-play" id="recPlayBtn" type="button" title="내 녹음 재생" disabled>▶</button>
    <button class="lb-play wc-recbar-opt" id="recTtsBtn" type="button" title="TTS로 듣기" disabled>TTS</button>
    <button class="lb-play wc-recbar-opt" id="recRepeatBtn" type="button" title="줄 반복" disabled>🔁</button>
    <button class="lb-play wc-recbar-opt" id="recSpeedBtn" type="button" title="재생 속도" disabled>1.0×</button>
    <button class="lb-play wc-recbar-rec" id="recRecBtn" type="button" title="녹음" disabled>⏺</button>
    <span class="wc-recbar-takes" id="recTakes"></span>
    <button class="lb-play wc-recbar-opt" id="recVsBtn" type="button" title="듣고 비교하기 (mp3·TTS·내 녹음)" disabled>vs</button>
    <span class="wc-recbar-line" id="recLineLabel"></span>
    <span class="wc-recbar-hint" id="recHint">문장의 ⏺ 버튼을 눌러 녹음을 시작하세요</span>
  </div>

  <script src="./js/supabase-config.js"></script>
  <script src="./js/db.js?v=viz-time-1"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/assets.js"></script>
  <script src="./js/levels.js?v=profile-xp-1"></script>
  <script src="./js/tts.js?v=bullets-1"></script>
  <script src="./js/word-info.js"></script>
  <script src="./js/wc-korbar.js"></script>
  <script src="./js/chunks.js"></script>
  <script src="./js/lesson.js?v=deselect-empty-1"></script>
  <script src="./js/sidebar.js?v=viz-time-1"></script>
  <script src="./js/quiz.js?v=profile-xp-1"></script>
  <script src="./js/encounter.js?v=color40-1"></script>
  <script>
    // ============================================================
    //  Sidebar collapse toggle — DESKTOP ONLY now. On mobile the
    //  desktop sidebar is hidden (CSS) and the new .wc-mobsh
    //  module below owns the word-detail surface. The chevron
    //  still flips the desktop column.
    // ============================================================
    (function () {
      const btn  = document.getElementById('sideToggle');
      const root = document.body;
      if (!btn) return;
      btn.addEventListener('click', () => {
        const collapsed = root.classList.toggle('wc-sidebar-collapsed');
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.textContent = collapsed ? '⟨' : '⟩';
      });
    })();

    // ============================================================
    //  MOBILE WORD SHEET + ACTION BAR — independent of the desktop
    //  sidebar (which is display:none on mobile). This module:
    //   1. Listens for wc:word-selected / wc:chunk-focused.
    //   2. Independently fetches data via WCKorBar (cached server
    //      side, so the duplicate cost is essentially zero).
    //   3. Renders into its own DOM:
    //        Page 1 (뜻)   — "Word: 한글뜻" headline + gray box
    //                        with chunk EN + chunk KO translation
    //        Page 2 (더보기) — 단어 가족 / 비슷한 말 / 반댓말
    //        Page 3 (메시지) — textarea + 보내기 (WCDB.viz.send)
    //   4. Sheet height ANIMATES smoothly between page heights as
    //      the user swipes (native scroll-snap-x for the gesture +
    //      a scroll listener that interpolates sheet height per
    //      scroll progress; CSS transition lerps the snap-settle).
    //   5. Bottom 8-button bar is ALWAYS visible:
    //        ▶ TTS · ‹ prev word · 1 2 3 4 ✓ · › next word
    //      — wired to existing WCTTS / WCLesson / btnPrev / btnNext.
    // ============================================================
    (function () {
      const root  = document.documentElement;
      const host  = document.getElementById('wcMobSh');
      const sheet = document.getElementById('wcMobShSheet');
      const pages = document.getElementById('wcMobShPages');
      if (!host || !sheet || !pages) return;

      const elHeadline = document.getElementById('wcMobShHeadline');
      const elChunk    = document.getElementById('wcMobShChunk');
      const elChunkEn  = document.getElementById('wcMobShChunkEn');
      const elChunkKo  = document.getElementById('wcMobShChunkKo');
      const elMore     = document.getElementById('wcMobShMore');
      const elMsgIn    = document.getElementById('wcMobShMsgInput');
      const elMsgBtn   = document.getElementById('wcMobShMsgSend');
      const elMsgStat  = document.getElementById('wcMobShMsgStatus');
      const btnClose   = document.getElementById('wcMobShClose');
      const btnTts     = document.getElementById('wcMobShTts');
      const btnPrev    = document.getElementById('wcMobShPrevWord');
      const btnNext    = document.getElementById('wcMobShNextWord');
      const lvlBtns    = host.querySelectorAll('.wc-mobsh-circ.is-lvl');

      // ── State ──
      let currentWord    = null;     // { word, lower, sentence }
      let currentChunk   = null;     // { chunk, sentence }
      let currentInfo    = null;     // resolved word info
      let isOpen         = false;
      // Carousel — logical page indices into PAGES[]. Left swipe
      // advances forward, right swipe retreats — both cycle.
      const PAGES = ['meaning', 'more', 'msg'];
      const pageEls = {
        meaning: pages.querySelector('[data-page="meaning"]'),
        more:    pages.querySelector('[data-page="more"]'),
        msg:     pages.querySelector('[data-page="msg"]'),
      };
      let curIdx = 0;   // index into PAGES of the visible page

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
      }
      function setSheetHeight(px, withTransition) {
        if (withTransition) {
          sheet.style.transition = 'height .22s cubic-bezier(.22,.6,.36,1)';
        } else {
          sheet.style.transition = 'none';
        }
        sheet.style.height = Math.max(0, px) + 'px';
      }
      // Measure a page's natural rendered height — only meaningful
      // when the page is in the DOM with display:block. Caller is
      // responsible for that.
      function pageNaturalHeight(el) {
        if (!el) return 0;
        // scrollHeight returns content height + padding; perfect
        // since each page is its own padded box.
        return el.scrollHeight;
      }

      // Make a page visible (display:block) and reset its transform.
      // Used at swipe-start to render the neighbor in DOM so we can
      // measure its natural height.
      function activatePage(name, role /* 'current' | 'neighbor' */) {
        const el = pageEls[name];
        if (!el) return null;
        el.classList.add('is-' + role);
        el.style.display = 'block';
        el.style.transform = '';
        el.style.transition = 'none';
        return el;
      }
      function deactivatePage(el) {
        if (!el) return;
        el.classList.remove('is-current', 'is-neighbor');
        el.style.display = '';
        el.style.transform = '';
        el.style.transition = '';
      }

      // Show one page as the sole visible page, instant.
      function showPageInstant(idx) {
        // Hide all, then activate the target.
        PAGES.forEach(name => deactivatePage(pageEls[name]));
        const el = activatePage(PAGES[idx], 'current');
        if (!el) return;
        // Set the sheet height to the page's natural height (no
        // transition — caller controls when to animate).
        const h = pageNaturalHeight(el);
        setSheetHeight(h, false);
        curIdx = idx;
      }

      // ── Open / close ──
      function openSheet() {
        const wasOpen = isOpen;
        isOpen = true;
        host.classList.add('is-open');
        host.setAttribute('aria-hidden', 'false');
        // Always reset to page 0 (meaning) on a fresh open.
        showPageInstant(0);
        // After the layout commits, run the push-up so the word
        // sits just above the sheet's top.
        requestAnimationFrame(() => {
          applyWordPushUp();
        });
        // First-open height transition — from 0 → measured.
        if (!wasOpen) {
          const finalH = sheet.offsetHeight;   // already set instant
          setSheetHeight(0, false);
          // Force the browser to commit the height:0 paint, then
          // animate to the measured height in the next frame.
          sheet.offsetHeight;                  // reflow
          requestAnimationFrame(() => {
            setSheetHeight(finalH, true);
          });
        }
      }
      function closeSheet() {
        if (!isOpen) return;
        isOpen = false;
        host.classList.remove('is-open');
        host.setAttribute('aria-hidden', 'true');
        setSheetHeight(0, true);
        // Reset the push-up (animated) so the lesson body slides
        // back down to its natural position.
        clearWordPushUp();
      }
      btnClose.addEventListener('click', closeSheet);

      // ── Word push-up (mirrors focus/english/lesson.html) ──
      // Shift the .wc-shell up so the selected word sits just above
      // the sheet's top edge. Re-runs on every word click + after the
      // sheet's height settles. Resets on close.
      function applyWordPushUp() {
        if (!isOpen || !currentWord) { clearWordPushUp(); return; }
        const wEl = document.querySelector(
          '.w.focused[data-word="' + cssEsc(currentWord.lower) + '"]')
          || document.querySelector('.w.focused');
        if (!wEl) return;
        const sheetTop  = sheet.getBoundingClientRect().top;
        const wRect     = wEl.getBoundingClientRect();
        const MARGIN    = 12;
        const desiredBottom = sheetTop - MARGIN;
        // Current push-up offset (CSS variable) so we compute the
        // word's "natural" bottom (without any active shift).
        const cssVar = parseFloat(
          getComputedStyle(document.body).getPropertyValue('--wc-pushup')) || 0;
        const naturalBottom = wRect.bottom + cssVar;
        let needed = 0;
        if (naturalBottom > desiredBottom) {
          needed = Math.ceil(naturalBottom - desiredBottom);
        }
        document.body.style.setProperty('--wc-pushup', needed + 'px');
        document.body.classList.toggle('wc-pushup', needed > 0);
      }
      function clearWordPushUp() {
        document.body.classList.remove('wc-pushup');
        document.body.style.removeProperty('--wc-pushup');
      }
      function cssEsc(s) {
        if (window.CSS && CSS.escape) return CSS.escape(String(s || ''));
        return String(s || '').replace(/["\\]/g, '\\$&');
      }
      // Re-apply push-up whenever the sheet's CSS height transition
      // finishes (because its top edge moved, changing desiredBottom).
      sheet.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'height' && isOpen) applyWordPushUp();
      });

      // ── Custom JS-driven carousel ──
      //  At rest, only one page is in the DOM as `.is-current`. On
      //  touch-start the start position is captured. On the first
      //  horizontal move past the dead zone, the neighbor page in
      //  the swipe direction is rendered (display:block) and parked
      //  at translateX(±100%). Both pages translate 1:1 with the
      //  finger. The sheet's height interpolates between current
      //  and neighbor's natural heights — both pages stay bottom-
      //  anchored, so their TOP edges land at DIFFERENT Y values
      //  whenever their content heights differ (matches the spec).
      let drag = null;
      function nextIdx(d) {
        // d = +1 for left swipe (forward), -1 for right swipe (back).
        return (curIdx + d + PAGES.length) % PAGES.length;
      }

      function onTouchStart(e) {
        if (!isOpen) return;
        if (drag) return;
        const t = e.touches && e.touches[0];
        if (!t) return;
        // Skip swipe on form elements inside the message page —
        // they need to receive touches themselves.
        if (e.target && e.target.closest(
          'textarea, input, button, a, .wc-mobsh-close')) return;
        const curEl = pageEls[PAGES[curIdx]];
        drag = {
          x0: t.clientX, y0: t.clientY,
          t0: Date.now(),
          stageW: pages.clientWidth,
          curEl,
          curH: pageNaturalHeight(curEl),
          neighborSide: 0,    // -1 = left, +1 = right, 0 = none yet
          neighborEl: null,
          neighborH: 0,
          axis: null,
          lastDx: 0,
        };
      }
      function ensureNeighbor(side) {
        // side = -1 → neighbor to the LEFT (right swipe shows it)
        //         = +1 → neighbor to the RIGHT (left swipe shows it)
        if (!drag) return;
        if (drag.neighborSide === side && drag.neighborEl) return;
        // Tear down a wrong-direction neighbor (e.g. user reversed).
        if (drag.neighborEl) {
          deactivatePage(drag.neighborEl);
          drag.neighborEl = null;
        }
        // Forward = +1 (left swipe) → target is curIdx + 1.
        // Backward = -1 (right swipe) → target is curIdx - 1 (= +2 mod 3).
        const tIdx = nextIdx(side === +1 ? +1 : -1);
        const el = activatePage(PAGES[tIdx], 'neighbor');
        if (!el) return;
        // Park at ±100% so it slides in from the correct side.
        el.style.transform = 'translateX(' + (side === +1 ? 100 : -100) + '%)';
        // Force the CSS to commit before we start reading scrollHeight.
        el.offsetHeight;
        drag.neighborSide = side;
        drag.neighborEl   = el;
        drag.neighborH    = pageNaturalHeight(el);
        drag.neighborIdx  = tIdx;
      }
      function setDragTransforms(dx) {
        if (!drag) return;
        const w = drag.stageW;
        drag.curEl.style.transition = 'none';
        drag.curEl.style.transform  = 'translateX(' + dx + 'px)';
        if (drag.neighborEl) {
          const park = drag.neighborSide === +1 ? +w : -w;
          drag.neighborEl.style.transition = 'none';
          drag.neighborEl.style.transform =
            'translateX(' + (park + dx) + 'px)';
          // Interpolate sheet height between current and neighbor.
          const t = Math.min(1, Math.abs(dx) / w);
          const h = drag.curH + (drag.neighborH - drag.curH) * t;
          setSheetHeight(h, false);
        }
      }

      function onTouchMove(e) {
        if (!drag) return;
        const t = e.touches && e.touches[0];
        if (!t) return;
        const dx = t.clientX - drag.x0;
        const dy = t.clientY - drag.y0;
        if (!drag.axis) {
          const ax = Math.abs(dx), ay = Math.abs(dy);
          if (Math.max(ax, ay) < 8) return;
          if (ax > ay) {
            drag.axis = 'h';
          } else {
            // Vertical — release ownership so the page can scroll.
            drag = null;
            return;
          }
        }
        if (drag.axis !== 'h') return;
        if (e.cancelable) e.preventDefault();
        // Pick neighbor based on swipe direction. Switching mid-drag
        // is fine — ensureNeighbor swaps the active neighbor element.
        const side = dx < 0 ? +1 : -1;
        ensureNeighbor(side);
        drag.lastDx = dx;
        setDragTransforms(dx);
      }
      function onTouchEnd() {
        if (!drag) return;
        if (drag.axis !== 'h') { drag = null; return; }
        const state = drag; drag = null;
        const dx       = state.lastDx;
        const w        = state.stageW;
        const elapsed  = Math.max(1, Date.now() - state.t0);
        const vel      = Math.abs(dx) / elapsed;
        const distThr  = w * 0.25;
        const isFlick  = vel > 0.6 && Math.abs(dx) > 40;
        const commit   = Math.abs(dx) >= distThr || isFlick;

        const ease = 'transform .22s cubic-bezier(.22,.6,.36,1)';
        const heightEase = 'height .22s cubic-bezier(.22,.6,.36,1)';
        state.curEl.style.transition      = ease;
        if (state.neighborEl) state.neighborEl.style.transition = ease;
        sheet.style.transition            = heightEase;

        if (commit && state.neighborEl) {
          // Commit: current exits off-screen the opposite side of
          // where neighbor came from; neighbor lands at 0.
          const exitSign = state.neighborSide === +1 ? -1 : +1;
          state.curEl.style.transform = 'translateX(' + (exitSign * w) + 'px)';
          state.neighborEl.style.transform = 'translateX(0)';
          setSheetHeight(state.neighborH, true);
          setTimeout(() => {
            // Promote neighbor → current; remove old current.
            deactivatePage(state.curEl);
            state.neighborEl.classList.remove('is-neighbor');
            state.neighborEl.classList.add('is-current');
            state.neighborEl.style.transform = '';
            curIdx = state.neighborIdx;
            // Re-apply push-up since the sheet height may have changed.
            applyWordPushUp();
          }, 230);
        } else {
          // Rollback.
          state.curEl.style.transform = 'translateX(0)';
          if (state.neighborEl) {
            const park = state.neighborSide === +1 ? +w : -w;
            state.neighborEl.style.transform = 'translateX(' + park + 'px)';
          }
          setSheetHeight(state.curH, true);
          setTimeout(() => {
            if (state.neighborEl) {
              deactivatePage(state.neighborEl);
            }
            applyWordPushUp();
          }, 230);
        }
      }
      // Stage owns the gestures — touch handlers attached here.
      pages.addEventListener('touchstart',  onTouchStart, { passive: true });
      pages.addEventListener('touchmove',   onTouchMove,  { passive: false });
      pages.addEventListener('touchend',    onTouchEnd);
      pages.addEventListener('touchcancel', onTouchEnd);

      // ── Page rendering ──
      function renderHeadline() {
        if (!currentWord) {
          elHeadline.innerHTML = '<span class="wc-muted">단어를 눌러보세요</span>';
          return;
        }
        const w  = currentWord.word || '';
        const ko = (currentInfo && currentInfo.ko) || '…';
        elHeadline.innerHTML =
          '<span class="wc-mobsh-en">' + esc(w) + ':</span>' +
          '<span class="wc-mobsh-ko">' + esc(ko) + '</span>';
      }
      function renderChunk(en, ko, mark) {
        if (!en && !ko) {
          elChunk.hidden = true;
          return;
        }
        elChunk.hidden = false;
        // Underline the chunk fragment that contains the selected
        // word inside the EN line. If mark not found, render plain.
        const markLower = (mark || '').toLowerCase();
        if (markLower && en) {
          const lower = en.toLowerCase();
          const idx = lower.indexOf(markLower);
          if (idx >= 0) {
            const before = en.slice(0, idx);
            const hit    = en.slice(idx, idx + markLower.length);
            const after  = en.slice(idx + markLower.length);
            elChunkEn.innerHTML = esc(before)
              + '<span class="wc-mobsh-chunk-mark">' + esc(hit) + '</span>'
              + esc(after);
          } else {
            elChunkEn.textContent = en;
          }
        } else {
          elChunkEn.textContent = en || '';
        }
        elChunkKo.textContent = ko || '';
      }
      function renderMore(info) {
        if (!info) {
          elMore.innerHTML = '<span class="wc-mobsh-more-empty">불러오는 중…</span>';
          return;
        }
        const fam = Array.isArray(info.word_family) ? info.word_family : [];
        const sim = Array.isArray(info.similar)     ? info.similar     : [];
        const opp = Array.isArray(info.opposite)    ? info.opposite    : [];
        const rows = [];
        if (fam.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">단어 가족</span>' +
            '<span class="wc-mobsh-more-val">' + esc(fam.join(' / ')) + '</span>' +
          '</div>');
        if (sim.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">비슷한 말</span>' +
            '<span class="wc-mobsh-more-val">' + esc(sim.join(', ')) + '</span>' +
          '</div>');
        if (opp.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">반댓말</span>' +
            '<span class="wc-mobsh-more-val">' + esc(opp.join(', ')) + '</span>' +
          '</div>');
        elMore.innerHTML = rows.length
          ? rows.join('')
          : '<span class="wc-mobsh-more-empty">관련된 말이 없어요.</span>';
      }

      // ── Data flow: hook into sidebar.js events ──
      window.addEventListener('wc:word-selected', (e) => {
        const d = e.detail || {};
        currentWord  = { word: d.word, lower: d.lower, sentence: d.sentence };
        currentChunk = null;
        currentInfo  = null;
        // Reset UI to loading state.
        renderHeadline();
        renderChunk('', '', '');
        renderMore(null);
        if (elMsgIn) elMsgIn.value = '';
        if (elMsgBtn) elMsgBtn.disabled = true;
        if (elMsgStat) elMsgStat.textContent = '';
        refreshLevelButtons();
        openSheet();
        // Independently fetch the word info — same call sidebar.js
        // makes, so the server cache hit is shared.
        if (!window.WCKorBar) return;
        const wantedLower = d.lower;
        window.WCKorBar.fetchWord(d.word, d.sentence).then(info => {
          // Bail if the user has tapped another word since.
          if (!currentWord || currentWord.lower !== wantedLower) return;
          currentInfo = info || null;
          renderHeadline();
          renderMore(info);
          // Content changed → re-fit the sheet to the visible page's
          // new natural height (animated).
          resizeCurrentPage();
        }).catch(() => {});
      });
      window.addEventListener('wc:word-deselected', closeSheet);
      window.addEventListener('wc:chunk-focused', (e) => {
        const d = e.detail || {};
        const chunkText = d.chunk;
        if (!chunkText || !d.sentence) {
          currentChunk = null;
          renderChunk('', '', '');
          resizeCurrentPage();
          return;
        }
        currentChunk = { chunk: chunkText, sentence: d.sentence };
        renderChunk(chunkText, '', currentWord ? currentWord.word : '');
        resizeCurrentPage();
        if (!window.WCKorBar) return;
        const seenChunk = chunkText, seenSent = d.sentence;
        window.WCKorBar.fetchChunk(chunkText, d.sentence).then(data => {
          if (!currentChunk
              || currentChunk.chunk    !== seenChunk
              || currentChunk.sentence !== seenSent) return;
          const ko = (data && data.ko) || '';
          renderChunk(chunkText, ko, currentWord ? currentWord.word : '');
          resizeCurrentPage();
        }).catch(() => {});
      });

      // When the visible page's content changes (info loaded, chunk
      // KO arrived, etc.), animate the sheet's height to fit the
      // new natural content height. Push-up re-runs after the
      // transitionend fires (see the listener inside the sheet
      // manager above).
      function resizeCurrentPage() {
        if (!isOpen) return;
        const el = pageEls[PAGES[curIdx]];
        if (!el) return;
        requestAnimationFrame(() => {
          const h = pageNaturalHeight(el);
          setSheetHeight(h, true);
        });
      }

      // ── Bottom bar: word actions ──
      // ▶ TTS — plays the WHOLE current page (not the single word).
      // Delegates to the existing #btnPlay handler so play/pause +
      // sentence-by-sentence scrolling logic stays in one place.
      // Re-tap → pause (same toggle behavior the desktop ▶ has).
      btnTts.addEventListener('click', () => {
        const playBtn = document.getElementById('btnPlay');
        if (playBtn) playBtn.click();
      });
      // Mirror the play/paused state on this bar so the icon swaps to
      // ⏸ while reading. lesson.js sets #btnPlay.textContent = '⏸/▶'
      // and toggles a .playing class — observe the class.
      (function () {
        const playBtn = document.getElementById('btnPlay');
        if (!playBtn) return;
        const syncTtsBtn = () => {
          const playing = playBtn.classList.contains('playing');
          btnTts.textContent = playing ? '⏸' : '▶';
          btnTts.classList.toggle('playing', playing);
          btnTts.setAttribute('aria-label', playing ? '읽기 정지' : '페이지 전체 읽기');
        };
        new MutationObserver(syncTtsBtn).observe(playBtn,
          { attributes: true, attributeFilter: ['class'] });
        syncTtsBtn();
      })();
      // Prev / Next WORD — delegate to lesson.js's existing buttons
      // so all the nav logic (chunk-focused, page boundary, etc.)
      // stays in one place. Clicking #btnPrev/#btnNext programatically
      // is identical to the user tapping them on desktop.
      btnPrev.addEventListener('click', () => {
        const b = document.getElementById('btnPrev');
        if (b) b.click();
      });
      btnNext.addEventListener('click', () => {
        const b = document.getElementById('btnNext');
        if (b) b.click();
      });
      // Level 1-5 — same code path as desktop's sidebar level-bar.
      lvlBtns.forEach(b => {
        b.addEventListener('click', () => {
          if (!currentWord) return;
          const lvl = parseInt(b.dataset.lvl, 10);
          if (!Number.isFinite(lvl)) return;
          if (window.WCLesson && typeof window.WCLesson.setWordLevel === 'function') {
            window.WCLesson.setWordLevel(currentWord.lower, lvl, currentWord.word);
          }
          refreshLevelButtons(lvl);
        });
      });
      // Reflect the active level on the bar — reads the current
      // word's stored level from WCLesson.wordLevels (the same map
      // the desktop sidebar's level-bar reads).
      function refreshLevelButtons(activeLvl) {
        if (activeLvl == null) {
          const lvls = window.WCLesson && window.WCLesson.wordLevels;
          const cw   = currentWord && currentWord.lower;
          activeLvl  = (lvls && cw && lvls.has(cw)) ? lvls.get(cw) : 0;
        }
        lvlBtns.forEach(b => {
          const l = parseInt(b.dataset.lvl, 10);
          b.classList.toggle('active', l === activeLvl);
        });
      }
      // Subscribe to WCLesson's level-change pump so the bar's active
      // dot updates the instant a level changes (whether the change
      // came from this bar, the desktop level-bar, or anywhere else).
      if (window.WCLesson && typeof window.WCLesson.onWordLevelChange === 'function') {
        window.WCLesson.onWordLevelChange((d) => {
          if (currentWord && d && d.word === currentWord.lower) {
            refreshLevelButtons(d.next);
          }
        });
      }
      window.addEventListener('wc:word-selected', () => setTimeout(refreshLevelButtons, 50));

      // ── Message form (page 3) ──
      if (elMsgIn) {
        elMsgIn.addEventListener('input', () => {
          elMsgBtn.disabled = !currentWord || !elMsgIn.value.trim();
        });
      }
      if (elMsgBtn) {
        elMsgBtn.addEventListener('click', async () => {
          if (!currentWord) return;
          const text = (elMsgIn.value || '').trim();
          if (!text) return;
          // The lesson + student ids live on the desktop lessonRef
          // sidebar.js init payload. We don't have direct access here
          // — but WCLesson exposes them.
          const me = window.WCLesson && window.WCLesson.me;
          const lessonId = window.WCLesson && window.WCLesson.lessonId;
          if (!me || !lessonId) {
            elMsgStat.textContent = '미리보기 모드에선 보낼 수 없어요.';
            return;
          }
          elMsgBtn.disabled = true;
          elMsgStat.textContent = '보내는 중…';
          try {
            await window.WCDB.viz.send(me.id, lessonId, currentWord.lower, text);
            elMsgStat.textContent = '잘 보냈어요! ✓';
            elMsgIn.value = '';
            setTimeout(() => { elMsgStat.textContent = ''; }, 1800);
          } catch (e) {
            elMsgStat.textContent = '보내지 못했어요.';
            elMsgBtn.disabled = false;
          }
        });
      }

      // Initial state — closed, height 0.
      setSheetHeight(0, false);
      // Re-fit on viewport resize (keyboard pop, rotation).
      window.addEventListener('resize', () => {
        if (!isOpen) return;
        resizeCurrentPage();
        applyWordPushUp();
      });
    })();

    // ============================================================
    //  MOBILE PAGE SWIPE — iPhone-home-screen style page turning.
    //  Touch anywhere on the lesson body and drag horizontally;
    //  the current page follows the finger while the neighbor
    //  page slides in from the opposite side. Pausing the finger
    //  pauses the animation; releasing past ~25% of the viewport
    //  width commits the page change, otherwise it rolls back.
    //
    //  Only active in paginated mode (NOT singleMode / scrollMode)
    //  with at least 2 pages. Vertical drags are passed through to
    //  the page scroll. Taps + word selections still work — the
    //  swipe machinery only engages once the user moves a few
    //  pixels horizontally past a dead zone.
    // ============================================================
    (function () {
      if (!window.matchMedia('(max-width: 900px)').matches) return;
      const body = document.getElementById('lessonBody');
      if (!body) return;
      const wrap = body.parentElement;     // .wc-lesson-text-wrap
      if (!wrap) return;

      // Stash the original transform so we can restore on rollback.
      let drag = null;
      // The setTimeout that runs commit/cleanup after the slide
      // animation. Tracked so onTouchStart can FAST-FORWARD it when
      // the user starts a new swipe before the 230 ms timer fires —
      // without this fast-forward, the timer fires mid-second-swipe,
      // resets body.style.transform = '' and swipeCommitPage runs
      // against a stale drag.pi → the new swipe appears to "stall"
      // after ~30 px because body keeps snapping back to 0.
      let pendingFn = null;
      let pendingT  = 0;
      function schedulePending(fn) {
        pendingFn = fn;
        pendingT  = setTimeout(() => { pendingT = 0; pendingFn = null; fn(); }, 230);
      }
      function flushPending() {
        if (!pendingT) return;
        clearTimeout(pendingT);
        pendingT = 0;
        const fn = pendingFn;
        pendingFn = null;
        if (fn) fn();
      }

      function shouldSwipe() {
        const L = window.WCLesson;
        if (!L) return false;
        if (L.singleMode || L.scrollMode) return false;
        return (L.pagesLength || 0) > 1;
      }
      // Skip swipe if the touch lands on an interactive element —
      // word click, sentence record button, TTS, sidebar toggle, etc.
      // We deliberately leave .w (word spans) NOT in the skip list so
      // students can start a swipe from anywhere in the text; a single
      // tap (no horizontal movement) still selects the word.
      function isInteractive(target) {
        if (!target || target === body) return false;
        return !!target.closest(
          'button, a, input, textarea, select, ' +
          '.wc-rec-btn, .wc-rec-tts, .wc-bubble-rec, ' +
          '.wc-take, .wc-mobsh, .wc-rec-bar'
        );
      }

      function makeClone(html, parkX) {
        const div = document.createElement('div');
        // Inherit lesson body classes (font, layout, padding, etc.)
        // so the clone visually matches the live body 1-to-1.
        div.className = body.className + ' wc-page-clone';
        div.style.position = 'absolute';
        div.style.top = '0';
        div.style.left = '0';
        div.style.right = '0';
        div.style.bottom = '0';
        div.style.transform = 'translateX(' + parkX + 'px)';
        div.style.pointerEvents = 'none';
        div.style.willChange = 'transform';
        div.style.zIndex = '1';
        div.innerHTML = html;
        return div;
      }

      function prepareClones(state) {
        const L = window.WCLesson;
        const pi = state.pi;
        const w  = state.pageW;
        // Previous (right swipe reveals this) — parked off-LEFT.
        if (pi > 0) {
          const html = L.renderPageHtml(pi - 1);
          if (html) {
            state.prevClone = makeClone(html, -w);
            wrap.appendChild(state.prevClone);
          }
        }
        // Next (left swipe reveals this) — parked off-RIGHT.
        if (pi < state.total - 1) {
          const html = L.renderPageHtml(pi + 1);
          if (html) {
            state.nextClone = makeClone(html, w);
            wrap.appendChild(state.nextClone);
          }
        }
      }

      function setTransforms(state, dx) {
        body.style.transform = 'translateX(' + dx + 'px)';
        if (state.prevClone) {
          state.prevClone.style.transform =
            'translateX(' + (-state.pageW + dx) + 'px)';
        }
        if (state.nextClone) {
          state.nextClone.style.transform =
            'translateX(' + (state.pageW + dx) + 'px)';
        }
      }

      function disableTransitions(state) {
        body.style.transition = 'none';
        if (state.prevClone) state.prevClone.style.transition = 'none';
        if (state.nextClone) state.nextClone.style.transition = 'none';
      }
      function enableTransitions(state, ease) {
        body.style.transition = ease;
        if (state.prevClone) state.prevClone.style.transition = ease;
        if (state.nextClone) state.nextClone.style.transition = ease;
      }

      // ORDER MATTERS here. The body element STILL has its inline
      // `transition: transform .22s ...` from enableTransitions when
      // this runs, AND its `transform: translateX(±100%)` from the
      // commit slide. If we naively reset `transform = ''`, the
      // browser animates the body BACK to translateX(0) WITH THE OLD
      // CONTENT — that's the "text quickly jumps left then back" the
      // student sees. Fix:
      //   1. Render the NEW page content into body while it's still
      //      offscreen (translateX(±100%)) — invisible.
      //   2. Disable transition + snap transform to 0 — instant, no
      //      animation. The clone (which has been showing the new
      //      content at translateX(0)) is briefly overlapped by body
      //      with identical content; visually seamless.
      //   3. Remove the clone.
      //   4. Restore transition for the next swipe.
      function commitAndCleanup(state, targetIdx) {
        // 1. Mount the new page DOM into body (still offscreen).
        if (targetIdx != null) {
          window.WCLesson.swipeCommitPage(targetIdx);
        }
        // 2. Snap body back to 0 without animation.
        body.style.transition = 'none';
        body.style.transform  = '';
        body.style.willChange = '';
        // Force the browser to commit transition:none + transform=''
        // in the SAME frame, before we clear transition.
        body.offsetHeight;
        body.style.transition = '';
        // 3. Drop the clones — body now owns the visible page.
        if (state.prevClone) state.prevClone.remove();
        if (state.nextClone) state.nextClone.remove();
      }
      // Kept for the rollback path (no content commit, just reset).
      function cleanup(state) {
        body.style.transition = 'none';
        body.style.transform  = '';
        body.style.willChange = '';
        body.offsetHeight;
        body.style.transition = '';
        if (state.prevClone) state.prevClone.remove();
        if (state.nextClone) state.nextClone.remove();
      }

      function onStart(e) {
        // If a previous swipe's commit/cleanup is still queued (the
        // 230 ms slide-finish setTimeout), run it RIGHT NOW so the
        // new swipe starts against fully-committed state instead of
        // racing it. Without this, ~1-in-N rapid swipes stalls at
        // ~30 px (the timer fires mid-drag and snaps body back).
        flushPending();
        if (drag) return;
        if (!shouldSwipe()) return;
        if (isInteractive(e.target)) return;
        const t = e.touches && e.touches[0];
        if (!t) return;
        drag = {
          x0: t.clientX, y0: t.clientY,
          t0: Date.now(),
          pageW: wrap.clientWidth,
          pi: window.WCLesson.pageIdx,
          total: window.WCLesson.pagesLength,
          axis: null,                 // 'h' | 'v' once locked
          prevClone: null, nextClone: null,
          lastDx: 0,
        };
      }

      function onMove(e) {
        if (!drag) return;
        const t = e.touches && e.touches[0];
        if (!t) return;
        const dx = t.clientX - drag.x0;
        const dy = t.clientY - drag.y0;
        // Lock the gesture axis on the first commit past the dead zone.
        if (!drag.axis) {
          const ax = Math.abs(dx), ay = Math.abs(dy);
          if (Math.max(ax, ay) < 8) return;
          drag.axis = ax > ay ? 'h' : 'v';
          if (drag.axis === 'h') {
            prepareClones(drag);
            disableTransitions(drag);
            body.style.willChange = 'transform';
          } else {
            // Vertical scroll — release ownership so the page scrolls.
            drag = null;
            return;
          }
        }
        if (drag.axis !== 'h') return;
        // Suppress browser scroll while we're driving a horizontal drag.
        // touchmove was attached with passive:false so preventDefault works.
        if (e.cancelable) e.preventDefault();
        // Clamp dx so the user can't drag past a non-existent neighbor —
        // pulls back with rubber-band feel (×0.3 past the boundary).
        let cdx = dx;
        if (dx > 0 && !drag.prevClone)      cdx = dx * 0.3;
        else if (dx < 0 && !drag.nextClone) cdx = dx * 0.3;
        drag.lastDx = cdx;
        setTransforms(drag, cdx);
      }

      function onEnd() {
        if (!drag) return;
        if (drag.axis !== 'h') { drag = null; return; }
        const state = drag; drag = null;
        const dx       = state.lastDx;
        const elapsed  = Math.max(1, Date.now() - state.t0);
        const velocity = Math.abs(dx) / elapsed;      // px/ms
        // Commit thresholds — either dragged past 25% of width, OR a
        // quick flick (>0.6 px/ms and >40 px).
        const distThresh = state.pageW * 0.25;
        const isFlick    = velocity > 0.6 && Math.abs(dx) > 40;
        let target = null;
        if ((dx <= -distThresh || (isFlick && dx < 0)) && state.nextClone) {
          target = 'next';
        } else if ((dx >= distThresh || (isFlick && dx > 0)) && state.prevClone) {
          target = 'prev';
        }
        // Animate body + clones to commit or rollback position.
        const ease = 'transform .22s cubic-bezier(.22,.6,.36,1)';
        enableTransitions(state, ease);
        if (target === 'next') {
          body.style.transform = 'translateX(' + (-state.pageW) + 'px)';
          state.nextClone.style.transform = 'translateX(0)';
          if (state.prevClone) state.prevClone.style.transform =
            'translateX(' + (-2 * state.pageW) + 'px)';
        } else if (target === 'prev') {
          body.style.transform = 'translateX(' + state.pageW + 'px)';
          state.prevClone.style.transform = 'translateX(0)';
          if (state.nextClone) state.nextClone.style.transform =
            'translateX(' + (2 * state.pageW) + 'px)';
        } else {
          body.style.transform = 'translateX(0)';
          if (state.prevClone) state.prevClone.style.transform =
            'translateX(' + (-state.pageW) + 'px)';
          if (state.nextClone) state.nextClone.style.transform =
            'translateX(' + (state.pageW) + 'px)';
        }
        // After the slide animation completes, swap content into body
        // (still offscreen) → snap body to 0 without animation → drop
        // the clones. Scheduled via schedulePending so a fast next
        // swipe can FAST-FORWARD this work in onStart instead of
        // racing it.
        schedulePending(() => {
          if (target === 'next') {
            commitAndCleanup(state, state.pi + 1);
          } else if (target === 'prev') {
            commitAndCleanup(state, state.pi - 1);
          } else {
            cleanup(state);
          }
        });
      }

      // touchmove is non-passive so we can preventDefault during the
      // horizontal drag (suppresses browser scroll). touchstart can
      // stay passive — we don't preventDefault there.
      body.addEventListener('touchstart',  onStart, { passive: true });
      body.addEventListener('touchmove',   onMove,  { passive: false });
      body.addEventListener('touchend',    onEnd);
      body.addEventListener('touchcancel', onEnd);
    })();

  </script>
</body>
</html>
