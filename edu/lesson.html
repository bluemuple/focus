<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ako — Reading</title>
  <link rel="stylesheet" href="./css/styles.css?v=mobsh-2">
  <!-- Dyslexia-friendly & readability fonts loaded only on the lesson
       page (where the "Read Better" toggle uses them). Cheap because
       they're fetched once and cached by the CDN, and the browser
       only downloads woff2 when the toggle is on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
  <link rel="stylesheet"
        href="https://fonts.cdnfonts.com/css/open-dyslexic">
  <!-- Preload the self-hosted OpenDyslexic OTF so the first Read Better
       toggle swaps fonts without a flash. `crossorigin` is harmless on
       same-origin requests and lets browsers reuse the preload for the
       @font-face fetch instead of double-fetching. -->
  <link rel="preload" href="./OpenDyslexic-Regular.otf"
        as="font" type="font/otf" crossorigin>
</head>
<body class="wc-lesson-layout">
  <!-- Stash the header in a hidden element so the lesson-page renders
       chrome-less per spec; profile / coin info still accessible via
       the bottom-bar 📋 button which routes to profile.html. -->
  <div id="userName" hidden>…</div>
  <div id="userMoney" hidden>0</div>
  <a href="#" id="logoutBtn" hidden></a>

  <div class="wc-shell wc-shell-wide">
    <div class="wc-lesson-grid">
      <!-- ============================================================
           MAIN reading card  (또박또박 layout)
           ============================================================ -->
      <article class="wc-lesson-main">

        <!-- Header — just back chip + title + 1문장씩, no thumbnail.
             The thumbnail used to mirror 또박또박's layout but the
             page counter moved to the bottom bar and lessons don't
             carry per-lesson thumbnail images, so it had no purpose
             remaining. -->
        <div class="wc-lesson-titlerow">
          <a class="back-btn" href="./home.html" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 6 9 12 15 18"/>
            </svg>
          </a>
          <h1 id="lessonTitle">Loading…</h1>
          <!-- Collapse the toolbar to give the reading text more room.
               Two SVG icons live inside the button — CSS swaps which
               is visible based on `body.wc-head-collapsed`. Inline SVG
               beats a webp here: sharper at any zoom, smaller payload,
               no extra HTTP fetch, picks up `currentColor`. -->
          <button class="ht-collapse" id="btnHeadCollapse" type="button"
                  aria-expanded="true" aria-label="Hide the toolbar"
                  title="Hide the toolbar">
            <!-- OPEN state — toolbar is showing; click hides it.
                 Three stacked bars represent the visible toolbar; the
                 student sees "three things on; tap to put them away". -->
            <svg class="ht-coll-svg ht-coll-open" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="7"  x2="19" y2="7"  />
              <line x1="5" y1="12" x2="19" y2="12" />
              <line x1="5" y1="17" x2="19" y2="17" />
            </svg>
            <!-- CLOSED state — toolbar is hidden; click expands it.
                 Title bar at top + chevron-down below = "more below,
                 tap to expand". Mirrors the open state's top bar so
                 the transition reads as "the rest collapses into a
                 single tuck-down arrow". -->
            <svg class="ht-coll-svg ht-coll-closed" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <line x1="5" y1="7" x2="19" y2="7" />
              <polyline points="7 13 12 18 17 13" />
            </svg>
          </button>
        </div>
        <div class="wc-lesson-head">
          <!-- Record mode — reveals a record button on every sentence
               so the student can record themselves reading it. -->
          <button class="ht-btn" id="btnRecord" type="button" aria-pressed="false"
                  title="Record yourself reading each sentence">
            <span class="ht-ico">⏺</span>
            <span class="ht-label">Record</span>
          </button>
          <button class="ht-btn" id="btnSingle" type="button" aria-pressed="false"
                  title="Show one sentence at a time, 2× size">
            <span class="ht-ico">📜</span>
            <span class="ht-label">1 Sentence</span>
          </button>
          <!-- Chunk-level auto-TTS toggle. Default = ON (Play chunk),
               so a fresh lesson immediately speaks each tapped word's
               chunk. The button only governs chunk-on-tap audio —
               full sentence play (▶), sidebar headword 🔊 and the
               other TTS calls bypass it. -->
          <button class="ht-btn active" id="btnChunkMute" type="button" aria-pressed="false"
                  title="Chunk audio on word tap — click to toggle">
            <span class="ht-ico" id="btnChunkMuteIco">🔊</span>
            <span class="ht-label" id="btnChunkMuteLabel">Play chunk</span>
          </button>
          <!-- Aa — reveals the text-size / line-spacing controls. The
               four A−/A+/↕−/↕+ buttons sit in .ht-fz-wrap, hidden by
               default; body.wc-fz-open (set by this button) shows them.
               State is per-device (localStorage). -->
          <button class="ht-btn" id="btnTextOpts" type="button" aria-pressed="false"
                  title="Text size & line spacing">
            <span class="ht-ico ht-ico-aa">Aa</span>
          </button>
          <span class="ht-fz-wrap" id="htFzWrap">
            <button class="ht-btn ht-btn-fz" id="btnFontMinus" type="button" title="Smaller text">A−</button>
            <button class="ht-btn ht-btn-fz" id="btnFontPlus"  type="button" title="Bigger text">A+</button>
            <button class="ht-btn ht-btn-fz" id="btnLhMinus"   type="button" title="Tighter line spacing">↕−</button>
            <button class="ht-btn ht-btn-fz" id="btnLhPlus"    type="button" title="Looser line spacing">↕+</button>
          </span>
          <button class="ht-btn" id="btnReadBetter" type="button" aria-pressed="false"
                  title="Switch to a dyslexia-friendly font">
            <span class="ht-ico">👓</span>
            <span class="ht-label">Read Better</span>
          </button>
          <!-- Per-device toggle to pause the animal-encounter system.
               DEFAULT = HIDDEN (off) — quiet reading mode is the
               out-of-the-box experience; the student can opt in by
               tapping this chip. Active state means encounters are
               HIDDEN. State persists via localStorage. -->
          <button class="ht-btn" id="btnHideEncounters" type="button" aria-pressed="false"
                  title="Pause animal quizzes — quiet reading mode">
            <span class="ht-ico" id="btnHideEncountersIco">🐾</span>
            <span class="ht-label" id="btnHideEncountersLabel">on</span>
          </button>
          <!-- Sidebar language — Kor Bar (Korean word card) / Eng Bar
               (English). Default Kor Bar. The Korean sidebar content
               itself lands in a later phase; this wires the toggle and
               flags <body> (wc-bar-kor / wc-bar-eng) for it. -->
          <button class="ht-btn" id="btnBarLang" type="button"
                  title="Sidebar language — Korean / English">
            <span class="ht-ico">🌐</span>
            <span class="ht-label" id="btnBarLangLabel">Kor Bar</span>
          </button>
          <!-- Continuous-scroll toggle — ⬇ off / on. ON drops
               pagination and flows the whole lesson in one
               scrollable column (comic panels stacked vertically).
               Default off for text/song lessons, on for comic. -->
          <button class="ht-btn" id="btnScrollMode" type="button" aria-pressed="false"
                  title="Continuous scroll — show the whole lesson in one scrolling column">
            <span class="ht-ico">⬇</span>
            <span class="ht-label" id="btnScrollModeLabel">off</span>
          </button>
        </div>

        <!-- Body. Paginated by paragraph: each <p class="para"> is one
             "page" the user steps through via the bottom-bar arrows. -->
        <div class="wc-lesson-text-wrap">
          <div id="lessonBody" class="wc-lesson-text">
            <p class="wc-muted">Loading lesson…</p>
          </div>
        </div>
      </article>

      <!-- ============================================================
           SIDEBAR  (또박또박-style: scroll body + bottom-fixed level-bar)
           ============================================================ -->
      <aside class="wc-sidebar" aria-label="Word details">
        <button class="wc-side-toggle" id="sideToggle" aria-expanded="true">⟩</button>
        <div class="wc-sidebar-scroll" id="sideScroll">
          <section id="sideWord"        class="wc-side-section wc-side-word"></section>
          <section id="sideViz"         class="wc-side-section"></section>
          <section id="sideReplies"     class="wc-side-section"></section>
        </div>
        <!-- Bottom-fixed level picker — same 6-circle layout as
             또박또박's .ls-bottom-fixed (🗑 1 2 3 4 ✓). Hidden until
             a word is selected so the sidebar doesn't feel busy when
             the student first lands on the lesson. -->
        <div class="wc-side-bottom-fixed" id="sideLevelBar" hidden></div>
      </aside>
    </div>
  </div>

  <!-- ============================================================
       STICKY BOTTOM BAR — 또박또박 style, 6 buttons
         ▶  ‹‹ (prev page)  ‹ (prev word)  N / total  › (next word)  ›› (next page)
       ============================================================ -->
  <div class="wc-lesson-bar" id="lessonBar">
    <button class="lb-play" id="btnPlay" aria-label="Play" title="Play / pause whole-lesson audio (spacebar)">▶</button>
    <!-- Play every sentence the student recorded, in order. Light-blue,
         hidden until at least one recording exists. -->
    <button class="lb-play wc-playrec wc-hidden" id="btnPlayRec" type="button"
            aria-label="내 녹음 전체 듣기" title="내 녹음 전체 듣기">▶</button>
    <button class="lb-arrow lb-arrow-page" id="btnPagePrev" aria-label="Previous page" title="Previous page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="18 6 12 12 18 18"/>
        <polyline points="12 6 6 12 12 18"/>
      </svg>
    </button>
    <button class="lb-arrow" id="btnPrev" aria-label="Previous word" title="Previous word">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 6 9 12 15 18"/>
      </svg>
    </button>
    <span class="lb-page-count" id="lbPageCount">1 / 1</span>
    <button class="lb-arrow" id="btnNext" aria-label="Next word" title="Next word">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 6 15 12 9 18"/>
      </svg>
    </button>
    <button class="lb-arrow lb-arrow-page" id="btnPageNext" aria-label="Next page" title="Next page">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 6 12 12 6 18"/>
        <polyline points="12 6 18 12 12 18"/>
      </svg>
    </button>
  </div>

  <!-- ============================================================
       MOBILE WORD SHEET + ACTION BAR (≤900px only — CSS-gated).
       Sheet (with × + 3 carousel pages) sits ABOVE an always-
       visible 8-button word-action bar. Empty until a word is
       tapped; sheet height animates per visible page. -->
  <div class="wc-mobsh" id="wcMobSh" aria-hidden="true">
    <div class="wc-mobsh-sheet" id="wcMobShSheet">
      <button class="wc-mobsh-close" id="wcMobShClose"
              type="button" aria-label="닫기">×</button>
      <div class="wc-mobsh-pages" id="wcMobShPages">
        <!-- Page 1 — 뜻: selected word + Korean meaning,
             chunk underline EN + Korean translation. -->
        <div class="wc-mobsh-page" data-page="meaning">
          <div class="wc-mobsh-headline" id="wcMobShHeadline">
            <span class="wc-mobsh-empty wc-muted">단어를 눌러보세요</span>
          </div>
          <div class="wc-mobsh-chunk" id="wcMobShChunk" hidden>
            <div class="wc-mobsh-chunk-en" id="wcMobShChunkEn"></div>
            <div class="wc-mobsh-chunk-ko" id="wcMobShChunkKo"></div>
          </div>
        </div>
        <!-- Page 2 — 단어 더보기: family / similar / opposite. -->
        <div class="wc-mobsh-page" data-page="more">
          <div class="wc-mobsh-more" id="wcMobShMore">
            <span class="wc-mobsh-more-empty">단어를 누르면 가족·비슷한·반대말이 보여요.</span>
          </div>
        </div>
        <!-- Page 3 — 메시지: 이 단어를 듣거나 써봤다면 적어줘. -->
        <div class="wc-mobsh-page" data-page="msg">
          <div class="wc-mobsh-msg-title">💌 이 단어를 듣거나 써봤다면 적어줘!</div>
          <textarea class="wc-mobsh-msg-input" id="wcMobShMsgInput"
                    rows="3" placeholder="언제, 어디서 이 단어를 만났는지 적어보세요."></textarea>
          <div class="wc-mobsh-msg-actions">
            <span class="wc-mobsh-msg-status" id="wcMobShMsgStatus"></span>
            <button class="wc-mobsh-msg-send" id="wcMobShMsgSend"
                    type="button" disabled>보내기 📨</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Always-visible 8-button word-action bar. -->
    <div class="wc-mobsh-bar" id="wcMobShBar">
      <button class="wc-mobsh-circ is-tts" id="wcMobShTts"
              type="button" aria-label="TTS 재생" title="TTS 재생">▶</button>
      <button class="wc-mobsh-circ" id="wcMobShPrevWord"
              type="button" aria-label="이전 단어" title="이전 단어">‹</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="1"
              type="button" aria-label="단계 1" title="잘 몰라요">1</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="2"
              type="button" aria-label="단계 2" title="조금 알아요">2</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="3"
              type="button" aria-label="단계 3" title="알아요">3</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="4"
              type="button" aria-label="단계 4" title="잘 알아요">4</button>
      <button class="wc-mobsh-circ is-lvl" data-lvl="5"
              type="button" aria-label="완전히 알아요" title="완전히 알아요">✓</button>
      <button class="wc-mobsh-circ" id="wcMobShNextWord"
              type="button" aria-label="다음 단어" title="다음 단어">›</button>
    </div>
  </div>

  <!-- Recording bar — replaces the nav bar while Record mode is on.
       Acts on the "active line" (the last sentence whose ⏺ was used).
       [▶ play] [⏺ record] [1][2][3] takes. -->
  <div class="wc-lesson-bar wc-rec-bar wc-hidden" id="wcRecBar">
    <button class="lb-play" id="recPlayBtn" type="button" title="내 녹음 재생" disabled>▶</button>
    <button class="lb-play wc-recbar-opt" id="recTtsBtn" type="button" title="TTS로 듣기" disabled>TTS</button>
    <button class="lb-play wc-recbar-opt" id="recRepeatBtn" type="button" title="줄 반복" disabled>🔁</button>
    <button class="lb-play wc-recbar-opt" id="recSpeedBtn" type="button" title="재생 속도" disabled>1.0×</button>
    <button class="lb-play wc-recbar-rec" id="recRecBtn" type="button" title="녹음" disabled>⏺</button>
    <span class="wc-recbar-takes" id="recTakes"></span>
    <button class="lb-play wc-recbar-opt" id="recVsBtn" type="button" title="듣고 비교하기 (mp3·TTS·내 녹음)" disabled>vs</button>
    <span class="wc-recbar-line" id="recLineLabel"></span>
    <span class="wc-recbar-hint" id="recHint">문장의 ⏺ 버튼을 눌러 녹음을 시작하세요</span>
  </div>

  <!-- Pre-set the toolbar-collapsed preference for first mobile load —
       MUST run BEFORE lesson.js reads localStorage, otherwise lesson.js
       sees the empty key, defaults headCollapsed=false, and writes '0',
       overriding our intent on this and every future load. -->
  <script>
    (function () {
      try {
        const HEAD_KEY = 'wc.headCollapsed.v1';
        if (localStorage.getItem(HEAD_KEY) !== null) return;
        if (!window.matchMedia('(max-width: 900px)').matches) return;
        localStorage.setItem(HEAD_KEY, '1');
      } catch {}
    })();
  </script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/db.js?v=viz-time-1"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/assets.js"></script>
  <script src="./js/levels.js?v=profile-xp-1"></script>
  <script src="./js/tts.js?v=bullets-1"></script>
  <script src="./js/word-info.js"></script>
  <script src="./js/wc-korbar.js"></script>
  <script src="./js/chunks.js"></script>
  <script src="./js/lesson.js?v=mobsh-2"></script>
  <script src="./js/sidebar.js?v=viz-time-1"></script>
  <script src="./js/quiz.js?v=profile-xp-1"></script>
  <script src="./js/encounter.js?v=rec-flow-2"></script>
  <script>
    // ============================================================
    //  Sidebar collapse toggle — DESKTOP ONLY now. On mobile the
    //  desktop sidebar is hidden (CSS) and the new .wc-mobsh
    //  module below owns the word-detail surface. The chevron
    //  still flips the desktop column.
    // ============================================================
    (function () {
      const btn  = document.getElementById('sideToggle');
      const root = document.body;
      if (!btn) return;
      btn.addEventListener('click', () => {
        const collapsed = root.classList.toggle('wc-sidebar-collapsed');
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.textContent = collapsed ? '⟨' : '⟩';
      });
    })();

    // ============================================================
    //  MOBILE WORD SHEET + ACTION BAR — independent of the desktop
    //  sidebar (which is display:none on mobile). This module:
    //   1. Listens for wc:word-selected / wc:chunk-focused.
    //   2. Independently fetches data via WCKorBar (cached server
    //      side, so the duplicate cost is essentially zero).
    //   3. Renders into its own DOM:
    //        Page 1 (뜻)   — "Word: 한글뜻" headline + gray box
    //                        with chunk EN + chunk KO translation
    //        Page 2 (더보기) — 단어 가족 / 비슷한 말 / 반댓말
    //        Page 3 (메시지) — textarea + 보내기 (WCDB.viz.send)
    //   4. Sheet height ANIMATES smoothly between page heights as
    //      the user swipes (native scroll-snap-x for the gesture +
    //      a scroll listener that interpolates sheet height per
    //      scroll progress; CSS transition lerps the snap-settle).
    //   5. Bottom 8-button bar is ALWAYS visible:
    //        ▶ TTS · ‹ prev word · 1 2 3 4 ✓ · › next word
    //      — wired to existing WCTTS / WCLesson / btnPrev / btnNext.
    // ============================================================
    (function () {
      if (!window.matchMedia('(max-width: 900px)').matches) {
        // Desktop — leave the .wc-mobsh element inert. We still
        // attach the resize listener at the very end so flipping
        // to mobile (rotation, devtools) re-initialises.
      }
      const root  = document.documentElement;
      const host  = document.getElementById('wcMobSh');
      const sheet = document.getElementById('wcMobShSheet');
      const pages = document.getElementById('wcMobShPages');
      if (!host || !sheet || !pages) return;

      const elHeadline = document.getElementById('wcMobShHeadline');
      const elChunk    = document.getElementById('wcMobShChunk');
      const elChunkEn  = document.getElementById('wcMobShChunkEn');
      const elChunkKo  = document.getElementById('wcMobShChunkKo');
      const elMore     = document.getElementById('wcMobShMore');
      const elMsgIn    = document.getElementById('wcMobShMsgInput');
      const elMsgBtn   = document.getElementById('wcMobShMsgSend');
      const elMsgStat  = document.getElementById('wcMobShMsgStatus');
      const btnClose   = document.getElementById('wcMobShClose');
      const btnTts     = document.getElementById('wcMobShTts');
      const btnPrev    = document.getElementById('wcMobShPrevWord');
      const btnNext    = document.getElementById('wcMobShNextWord');
      const lvlBtns    = host.querySelectorAll('.wc-mobsh-circ.is-lvl');

      // ── State ──
      let currentWord     = null;     // { word, lower, sentence }
      let currentChunk    = null;     // { chunk, sentence }
      let currentInfo     = null;     // resolved word info
      let isOpen          = false;
      let lessonRef       = null;     // captured from WCLesson init payload
      let pageHeights     = [80, 80, 130];
      let scrollAnimRaf   = 0;

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
      }
      function setSheetHeight(px) {
        sheet.style.height = Math.max(0, px) + 'px';
      }
      // Measure each page's natural content height by temporarily
      // freeing the page from the carousel constraints. Cached per
      // current word render so we can interpolate during swipes.
      function measurePages() {
        const arr = [];
        pages.querySelectorAll('.wc-mobsh-page').forEach(p => {
          // Natural content height + page's own vertical padding.
          // scrollHeight gives content + padding (without borders) —
          // close enough for the dynamic height target.
          arr.push(p.scrollHeight);
        });
        pageHeights = arr.length ? arr : [80];
        return pageHeights;
      }
      // Apply the height of whichever page is currently snapped.
      function syncHeightToCurrent() {
        if (!isOpen) { setSheetHeight(0); return; }
        const w = pages.clientWidth || 1;
        const idx = Math.round(pages.scrollLeft / w);
        const h = pageHeights[idx] || 100;
        setSheetHeight(h);
      }
      // During an active swipe, interpolate height between current
      // and next page so the sheet's top edge slides with the finger.
      function onPagesScroll() {
        if (scrollAnimRaf) return;
        scrollAnimRaf = requestAnimationFrame(() => {
          scrollAnimRaf = 0;
          if (!isOpen) return;
          const w = pages.clientWidth || 1;
          const raw = pages.scrollLeft / w;
          const i0  = Math.floor(raw);
          const i1  = Math.min(pageHeights.length - 1, i0 + 1);
          const t   = Math.max(0, Math.min(1, raw - i0));
          const h0  = pageHeights[i0] || 100;
          const h1  = pageHeights[i1] || h0;
          const h   = h0 + (h1 - h0) * t;
          // Suppress the CSS transition while the finger is moving —
          // tracking the scroll position 1:1 looks crisper than a
          // 250 ms ease lagging behind the touch.
          sheet.style.transition = 'none';
          setSheetHeight(h);
        });
      }
      // After scroll settles, restore the CSS transition for the
      // next programmatic jump (carousel loop, page reset, etc.).
      let scrollIdleT = 0;
      pages.addEventListener('scroll', () => {
        onPagesScroll();
        clearTimeout(scrollIdleT);
        scrollIdleT = setTimeout(() => {
          sheet.style.transition = '';
          measurePages();
          syncHeightToCurrent();
        }, 120);
      }, { passive: true });

      // ── Looping carousel: swiping past either edge wraps around.
      //    Native scroll-snap clamps at the ends (it won't overshoot),
      //    so we detect "the user clearly tried to swipe further but
      //    didn't move" and JS-scroll to the opposite end. Threshold
      //    40 px keeps small accidental drags from triggering a loop.
      let touchX0 = null;
      let touchStartIdx = null;
      pages.addEventListener('touchstart', (e) => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        touchX0 = t.clientX;
        const w = pages.clientWidth || 1;
        touchStartIdx = Math.round(pages.scrollLeft / w);
      }, { passive: true });
      pages.addEventListener('touchend', (e) => {
        if (touchX0 == null) return;
        const t = (e.changedTouches && e.changedTouches[0]);
        if (!t) { touchX0 = null; return; }
        const dx = t.clientX - touchX0;
        const startIdx = touchStartIdx;
        touchX0 = null;
        touchStartIdx = null;
        // Wait for the scroll-snap to settle, then check whether the
        // browser actually moved. If not AND the gesture was a clear
        // swipe past the boundary, jump to the opposite end.
        setTimeout(() => {
          const w  = pages.clientWidth || 1;
          const N  = pages.querySelectorAll('.wc-mobsh-page').length;
          const idx = Math.round(pages.scrollLeft / w);
          if (idx !== startIdx) return;          // normal snap happened
          const SWIPE_MIN = 40;
          if (dx <= -SWIPE_MIN && idx === N - 1) {
            // Left swipe at last page → wrap to first.
            pages.scrollTo({ left: 0, behavior: 'smooth' });
          } else if (dx >= SWIPE_MIN && idx === 0) {
            // Right swipe at first page → wrap to last.
            pages.scrollTo({ left: (N - 1) * w, behavior: 'smooth' });
          }
        }, 160);
      }, { passive: true });

      // ── Open / close ──
      function openSheet() {
        if (isOpen) return;
        isOpen = true;
        host.classList.add('is-open');
        host.setAttribute('aria-hidden', 'false');
        // Always reset to page 1 on open per spec.
        pages.scrollTo({ left: 0, behavior: 'auto' });
        requestAnimationFrame(() => {
          measurePages();
          syncHeightToCurrent();
        });
      }
      function closeSheet() {
        if (!isOpen) return;
        isOpen = false;
        host.classList.remove('is-open');
        host.setAttribute('aria-hidden', 'true');
        setSheetHeight(0);
      }
      btnClose.addEventListener('click', closeSheet);

      // ── Page rendering ──
      function renderHeadline() {
        if (!currentWord) {
          elHeadline.innerHTML = '<span class="wc-muted">단어를 눌러보세요</span>';
          return;
        }
        const w  = currentWord.word || '';
        const ko = (currentInfo && currentInfo.ko) || '…';
        elHeadline.innerHTML =
          '<span class="wc-mobsh-en">' + esc(w) + ':</span>' +
          '<span class="wc-mobsh-ko">' + esc(ko) + '</span>';
      }
      function renderChunk(en, ko, mark) {
        if (!en && !ko) {
          elChunk.hidden = true;
          return;
        }
        elChunk.hidden = false;
        // Underline the chunk fragment that contains the selected
        // word inside the EN line. If mark not found, render plain.
        const markLower = (mark || '').toLowerCase();
        if (markLower && en) {
          const lower = en.toLowerCase();
          const idx = lower.indexOf(markLower);
          if (idx >= 0) {
            const before = en.slice(0, idx);
            const hit    = en.slice(idx, idx + markLower.length);
            const after  = en.slice(idx + markLower.length);
            elChunkEn.innerHTML = esc(before)
              + '<span class="wc-mobsh-chunk-mark">' + esc(hit) + '</span>'
              + esc(after);
          } else {
            elChunkEn.textContent = en;
          }
        } else {
          elChunkEn.textContent = en || '';
        }
        elChunkKo.textContent = ko || '';
      }
      function renderMore(info) {
        if (!info) {
          elMore.innerHTML = '<span class="wc-mobsh-more-empty">불러오는 중…</span>';
          return;
        }
        const fam = Array.isArray(info.word_family) ? info.word_family : [];
        const sim = Array.isArray(info.similar)     ? info.similar     : [];
        const opp = Array.isArray(info.opposite)    ? info.opposite    : [];
        const rows = [];
        if (fam.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">단어 가족</span>' +
            '<span class="wc-mobsh-more-val">' + esc(fam.join(' / ')) + '</span>' +
          '</div>');
        if (sim.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">비슷한 말</span>' +
            '<span class="wc-mobsh-more-val">' + esc(sim.join(', ')) + '</span>' +
          '</div>');
        if (opp.length) rows.push(
          '<div class="wc-mobsh-more-row">' +
            '<span class="wc-mobsh-more-label">반댓말</span>' +
            '<span class="wc-mobsh-more-val">' + esc(opp.join(', ')) + '</span>' +
          '</div>');
        elMore.innerHTML = rows.length
          ? rows.join('')
          : '<span class="wc-mobsh-more-empty">관련된 말이 없어요.</span>';
      }

      // ── Data flow: hook into sidebar.js events ──
      window.addEventListener('wc:word-selected', (e) => {
        const d = e.detail || {};
        currentWord  = { word: d.word, lower: d.lower, sentence: d.sentence };
        currentChunk = null;
        currentInfo  = null;
        // Reset UI to loading state.
        renderHeadline();
        renderChunk('', '', '');
        renderMore(null);
        if (elMsgIn) elMsgIn.value = '';
        if (elMsgBtn) elMsgBtn.disabled = true;
        if (elMsgStat) elMsgStat.textContent = '';
        refreshLevelButtons();
        openSheet();
        // Independently fetch the word info — same call sidebar.js
        // makes, so the server cache hit is shared.
        if (!window.WCKorBar) return;
        const wantedLower = d.lower;
        window.WCKorBar.fetchWord(d.word, d.sentence).then(info => {
          // Bail if the user has tapped another word since.
          if (!currentWord || currentWord.lower !== wantedLower) return;
          currentInfo = info || null;
          renderHeadline();
          renderMore(info);
          requestAnimationFrame(() => {
            measurePages();
            syncHeightToCurrent();
          });
        }).catch(() => {});
      });
      window.addEventListener('wc:word-deselected', closeSheet);
      window.addEventListener('wc:chunk-focused', (e) => {
        const d = e.detail || {};
        // Only render a real multi-word chunk — a single-word "chunk"
        // would just duplicate the headline.
        const chunkText = d.chunk;
        if (!chunkText || !d.sentence) {
          currentChunk = null;
          renderChunk('', '', '');
          return;
        }
        currentChunk = { chunk: chunkText, sentence: d.sentence };
        // Show the EN immediately; fetch KO lazily.
        renderChunk(chunkText, '', currentWord ? currentWord.word : '');
        requestAnimationFrame(() => { measurePages(); syncHeightToCurrent(); });
        if (!window.WCKorBar) return;
        const seenChunk = chunkText, seenSent = d.sentence;
        window.WCKorBar.fetchChunk(chunkText, d.sentence).then(data => {
          if (!currentChunk
              || currentChunk.chunk    !== seenChunk
              || currentChunk.sentence !== seenSent) return;
          const ko = (data && data.ko) || '';
          renderChunk(chunkText, ko, currentWord ? currentWord.word : '');
          requestAnimationFrame(() => { measurePages(); syncHeightToCurrent(); });
        }).catch(() => {});
      });

      // ── Bottom bar: word actions ──
      // TTS — speak the current word (falls back to lemma if known).
      btnTts.addEventListener('click', () => {
        if (!currentWord || !window.WCTTS) return;
        const sayIt = (currentInfo && currentInfo.lemma) || currentWord.word;
        window.WCTTS.speak(sayIt).catch(() => {});
      });
      // Prev / Next WORD — delegate to lesson.js's existing buttons
      // so all the nav logic (chunk-focused, page boundary, etc.)
      // stays in one place. Clicking #btnPrev/#btnNext programatically
      // is identical to the user tapping them on desktop.
      btnPrev.addEventListener('click', () => {
        const b = document.getElementById('btnPrev');
        if (b) b.click();
      });
      btnNext.addEventListener('click', () => {
        const b = document.getElementById('btnNext');
        if (b) b.click();
      });
      // Level 1-5 — same code path as desktop's sidebar level-bar.
      lvlBtns.forEach(b => {
        b.addEventListener('click', () => {
          if (!currentWord) return;
          const lvl = parseInt(b.dataset.lvl, 10);
          if (!Number.isFinite(lvl)) return;
          if (window.WCLesson && typeof window.WCLesson.setWordLevel === 'function') {
            window.WCLesson.setWordLevel(currentWord.lower, lvl, currentWord.word);
          }
          refreshLevelButtons(lvl);
        });
      });
      // Reflect the active level on the bar — reads the current
      // word's stored level from WCLesson.wordLevels (the same map
      // the desktop sidebar's level-bar reads).
      function refreshLevelButtons(activeLvl) {
        if (activeLvl == null) {
          const lvls = window.WCLesson && window.WCLesson.wordLevels;
          const cw   = currentWord && currentWord.lower;
          activeLvl  = (lvls && cw && lvls.has(cw)) ? lvls.get(cw) : 0;
        }
        lvlBtns.forEach(b => {
          const l = parseInt(b.dataset.lvl, 10);
          b.classList.toggle('active', l === activeLvl);
        });
      }
      // Subscribe to WCLesson's level-change pump so the bar's active
      // dot updates the instant a level changes (whether the change
      // came from this bar, the desktop level-bar, or anywhere else).
      if (window.WCLesson && typeof window.WCLesson.onWordLevelChange === 'function') {
        window.WCLesson.onWordLevelChange((d) => {
          if (currentWord && d && d.word === currentWord.lower) {
            refreshLevelButtons(d.next);
          }
        });
      }
      window.addEventListener('wc:word-selected', () => setTimeout(refreshLevelButtons, 50));

      // ── Message form (page 3) ──
      if (elMsgIn) {
        elMsgIn.addEventListener('input', () => {
          elMsgBtn.disabled = !currentWord || !elMsgIn.value.trim();
        });
      }
      if (elMsgBtn) {
        elMsgBtn.addEventListener('click', async () => {
          if (!currentWord) return;
          const text = (elMsgIn.value || '').trim();
          if (!text) return;
          // The lesson + student ids live on the desktop lessonRef
          // sidebar.js init payload. We don't have direct access here
          // — but WCLesson exposes them.
          const me = window.WCLesson && window.WCLesson.me;
          const lessonId = window.WCLesson && window.WCLesson.lessonId;
          if (!me || !lessonId) {
            elMsgStat.textContent = '미리보기 모드에선 보낼 수 없어요.';
            return;
          }
          elMsgBtn.disabled = true;
          elMsgStat.textContent = '보내는 중…';
          try {
            await window.WCDB.viz.send(me.id, lessonId, currentWord.lower, text);
            elMsgStat.textContent = '잘 보냈어요! ✓';
            elMsgIn.value = '';
            setTimeout(() => { elMsgStat.textContent = ''; }, 1800);
          } catch (e) {
            elMsgStat.textContent = '보내지 못했어요.';
            elMsgBtn.disabled = false;
          }
        });
      }

      // Initial state — closed, height 0.
      setSheetHeight(0);
      // Re-measure on resize (keyboard pop, rotation).
      window.addEventListener('resize', () => {
        if (!isOpen) return;
        requestAnimationFrame(() => { measurePages(); syncHeightToCurrent(); });
      });
    })();

  </script>
</body>
</html>
