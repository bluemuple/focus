        updateBlock(blockY, yPrev, targetY);
        // Wait for the just-rendered Y to be in the DOM, then wire
        // the click affordance.
        requestAnimationFrame(refreshYClickAffordance);
      } else {
        blockY.innerHTML = '';
      }
    }

    // ----- Input wiring ---------------------------------------------
    // Plain typing on either input updates the visualisation live.
    [numX, numY].forEach(el => {
      el.addEventListener('input', () => updateAll());
      // Keyboard ← / → on a focused input does ±1. Native ↑ / ↓
      // already work on number inputs but we mirror them onto the
      // horizontal arrows so the kid only needs to remember "side
      // arrows" once they've clicked a digit image.
      el.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          stepInput(el, -1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          stepInput(el, 1);
        }
      });
    });

    // ‹ / › side-arrow buttons — same effect as keyboard ← / →.
    document.querySelectorAll('.arrow').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        const el     = target === 'x' ? numX : numY;
        const delta  = btn.classList.contains('arrow-right') ? 1 : -1;
        stepInput(el, delta);
      });
    });

    function stepInput(el, delta) {
      const cur  = parseInt(el.value, 10);
      const base = Number.isFinite(cur) ? cur : (parseInt(el.min, 10) || 0);
      const next = clampToBounds(el, base + delta);
      el.value = String(next);
      updateAll();
    }

    // Clicking the digit-image area also focuses the matching input
    // so keyboard arrows take over from there. (For Y the same
    // click can also fire the split / direct-explode flow — that's
    // wired separately in refreshYClickAffordance.)
    blockX.addEventListener('click', () => numX.focus());
    blockY.addEventListener('click', () => numY.focus());

    // ----- Question generators ------------------------------------
    // Always X > Y.
    //   1 — Easy   nn − n  : 2-digit X, 1-digit Y, X_ones > Y_ones
    //                        (no borrow needed)
    //   2 — Medium nn − n  : 2-digit X (tens ≤ 4), 1-digit Y,
    //                        X_ones < Y_ones (borrow needed)
    //   3 — Easy   nn − nn : both 2-digit, tens ≤ 4, X_ones > Y_ones
    //   4 — Medium nn − nn : both 2-digit, tens ≤ 4, X_ones < Y_ones
    function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
    const generators = {
      'easy-nn-n':    () => {
        // X tens ≤ 4 (X in 10-49) per the user's spec — both
        // numbers' tens digits stay ≤ 4. Y is single-digit so
        // Y_tens = 0 trivially satisfies the rule.
        while (true) {
          const x = randInt(10, 49), y = randInt(1, 9);
          if (x > y && (x % 10) > y) return { x, y };
        }
      },
      'medium-nn-n':  () => {
        while (true) {
          const x = randInt(10, 49), y = randInt(1, 9);
          if (x > y && (x % 10) < y) return { x, y };
        }
      },
      'easy-nn-nn':   () => {
        while (true) {
          const xT = randInt(1, 4), xO = randInt(0, 9);
          const yT = randInt(1, 4), yO = randInt(0, 9);
          const x = xT * 10 + xO, y = yT * 10 + yO;
          if (x > y && xO > yO) return { x, y };
        }
      },
      'medium-nn-nn': () => {
        while (true) {
          const xT = randInt(1, 4), xO = randInt(0, 9);
          const yT = randInt(1, 4), yO = randInt(0, 9);
          const x = xT * 10 + xO, y = yT * 10 + yO;
          if (x > y && xO < yO) return { x, y };
        }
      },
    };
    function applyGenerated(kind) {
      const fn = generators[kind];
      if (!fn) return;
      const { x, y } = fn();
      numX.value = String(x);
      numY.value = String(y);
      updateAll();
    }
    document.querySelectorAll('.gen-btn').forEach(btn => {
      btn.addEventListener('click', () => applyGenerated(btn.dataset.gen));
    });
    // Keyboard 1..4 → fire generators; 5 → flip the auto-fly-digit
    // toggle. Only when no input is focused, so the kid can still
    // type digits into X / Y without these shortcuts hijacking
    // the number keys.
    const GEN_ORDER = ['easy-nn-n', 'medium-nn-n', 'easy-nn-nn', 'medium-nn-nn'];
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        applyGenerated(GEN_ORDER[parseInt(e.key, 10) - 1]);
      } else if (e.key === '5') {
        e.preventDefault();
        separateBtn.click();
      }
    });

    // ----- "Fly the digit separately" toggle ----------------------
    // Default OFF — the box-fire phase auto-runs the digit-fly
    // right after. When ON, the box-fire ends after the boxes
    // explode and the digit waits for its OWN click before flying.
    const SEP_KEY = 'mb-separate';
    let digitSeparate = false;
    try { digitSeparate = localStorage.getItem(SEP_KEY) === '1'; } catch {}
    function applySepUi() {
      separateBtn.setAttribute('aria-pressed', String(digitSeparate));
      // Update only the LABEL span (.tg-on). The .gen-key chip
      // sits next to it and stays put.
      const lbl = separateBtn.querySelector('.tg-on');
      if (lbl) lbl.textContent = digitSeparate ? '✂️ Click digit to fly' : '🔗 Auto fly digit';
    }
    separateBtn.addEventListener('click', () => {
      digitSeparate = !digitSeparate;
      try { localStorage.setItem(SEP_KEY, digitSeparate ? '1' : '0'); } catch {}
      applySepUi();
    });
    applySepUi();

    // ----- Autofit -------------------------------------------------
    // Squares get many on a multi-digit X (e.g. 33 has 3 ten-groups
    // wrapping into 2 rows of squares — total height ~850px BEFORE
    // accounting for the digit images on top). On smaller classroom
    // screens that pushes content below the fold. We measure the
    // natural layout size and apply a single `transform: scale()`
    // on `.page` so EVERYTHING (heading, inputs, digits, squares,
    // explosions) shrinks proportionally. Floor at 0.5 so we
    // never go too small — the kid still needs to read it.
    const pageEl = document.querySelector('.page');
    let lastAppliedZoom = 1;
    // Hysteresis threshold — a target-zoom this close to what we
    // already have won't re-apply. Stops 1-2 box jitter from
    // flipping the page in/out of zoom on every keystroke; a full
    // ten-group (gain/loss of ~10 boxes) easily crosses this
    // threshold so the page DOES re-fit when it matters.
    const ZOOM_HYSTERESIS = 0.05;
    function autofit() {
      if (!pageEl) return;
      // Reset to natural size before measuring. We use `zoom`
      // rather than `transform: scale` because zoom also shrinks
      // the element's LAYOUT box — otherwise the un-scaled height
      // still pushes the body taller than the viewport and leaves
      // a residual scrollbar.
      pageEl.style.zoom = '';
      const r = pageEl.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      const pad = 20;
      const sx = (window.innerWidth  - pad) / r.width;
      const sy = (window.innerHeight - pad) / r.height;
      // Allow zoom UP to fill the screen when content shrinks
      // (e.g. 34 − 19 → 24 − 19 — one less ten group means lots
      // of empty space below; we want to enlarge the rest).
      let s = Math.min(sx, sy);
      s = Math.max(0.5, Math.min(2.0, s));
      // Skip if the new zoom is close to the one we already have.
      if (Math.abs(s - lastAppliedZoom) < ZOOM_HYSTERESIS) {
        if (lastAppliedZoom !== 1) pageEl.style.zoom = lastAppliedZoom;
        return;
      }
      lastAppliedZoom = s;
      if (Math.abs(s - 1) < 0.001) {
        pageEl.style.zoom = '';
      } else {
        pageEl.style.zoom = s;
      }
    }
    // Re-fit on resize + after every render path. The flight /
    // explosion animations also reflow the page, so we autofit at
    // the end of `updateBlock` indirectly by calling it after each
    // visible change via a debounced rAF.
    let _autofitPending = false;
    function autofitSoon() {
      if (_autofitPending) return;
      _autofitPending = true;
      requestAnimationFrame(() => {
        _autofitPending = false;
        autofit();
      });
    }
    window.addEventListener('resize', autofit);

    // Wrap updateAll + updateBlock so a fresh autofit follows every
    // layout-affecting call without scattering autofit() everywhere.
    const _origUpdateAll   = updateAll;
    const _origUpdateBlock = updateBlock;
    updateAll = function (...args) {
      const r = _origUpdateAll.apply(this, args);
      autofitSoon();
      return r;
    };
    updateBlock = function (...args) {
      const r = _origUpdateBlock.apply(this, args);
      autofitSoon();
      return r;
    };

    // First paint.
    updateAll();
    // After the initial layout settles + digit images load, fit again.
    setTimeout(autofit, 60);
    window.addEventListener('load', autofit);
  })();
  </script>
</body>
</html>
